# Local-e puro stack: database (pgvector shoho) + backend + frontend.
# Chalao: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env          # API key, SMTP, JWT_SECRET ekhan theke
    environment:                      # nicher gulo env_file-er upor boshe (Neon-er bodole local db)
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_interview
      FRONTEND_ORIGINS: http://localhost:8080,http://localhost:5173
      PUBLIC_APP_URL: http://localhost:8080
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Pytest-er jonno alada database (Neon-er cheye onek druto). Chalao:
  #   docker compose --profile test up -d testdb
  testdb:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"

volumes:
  pgdata:
  uploads:

